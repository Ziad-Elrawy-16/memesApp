<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memes</title>
    <link rel="stylesheet" href="css/all.css" />
    <link rel="stylesheet" href="css/bootstrap.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div
      class="bg-dark min-vh-100 d-flex justify-content-center align-items-start pt-3"
    >
      <div class="col-lg-5 col-md-6 col-11 py-5 px-2">
        <div class="rounded-4 shadow-lg bg-black p-3">
          <div class="mb-2">
            <div class="text-capitalize text-center">
              <p class="text-danger fs-3 fw-bold text-decoration-underline">
                Enter number from 0 to 99
              </p>
            </div>
            <form class="py-3 px-5">
              <input
                type="text"
                class="form-control bg-danger myInput text-warning"
              />
            </form>
            <div class="px-5">
              <button
                type="button"
                class="btn btn-danger w-100 myBtn text-warning"
              >
                Show Meme
              </button>
            </div>
          </div>
        </div>
        <div
          class="rounded-4 shadow-lg bg-black p-3 mt-3 myResult d-none"
        ></div>
      </div>
    </div>
    <!-- js -->
    <script src="js/all.js"></script>
    <script src="js/bootstrap.bundle.js"></script>
    <script src="js/style.js"></script>
  </body>
</html>
